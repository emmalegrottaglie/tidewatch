name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The data pipeline calls this after each run so new data goes live.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Precomputed data from the pipeline. Only its public/ folder is served; state/ stays private
      # to the pipeline. Before the first pipeline run the branch doesn't exist and the site works
      # without it.
      - name: Check out pipeline data
        id: data
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: data
          path: _data
      - name: Add pipeline data to the site
        if: steps.data.outcome == 'success'
        run: cp -r _data/public site/data
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
