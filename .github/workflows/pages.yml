name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The data pipeline calls this after each run so new data goes live.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Precomputed data from the pipeline. Only its public/ folder is served; state/ stays private
      # to the pipeline. Before the first pipeline run the branch doesn't exist and the site works
      # without it.
      - name: Check out pipeline data
        id: data
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: data
          path: _data
      - name: Add pipeline data to the site
        if: steps.data.outcome == 'success'
        run: cp -r _data/public site/data
      - uses: actions/configure-pages@v6
      # The artifact name includes the attempt number: deploy-pages refuses to run when a re-run
      # finds an earlier attempt's artifact with the same name.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      # GitHub sometimes reports a just-uploaded artifact as missing for a few seconds, which
      # fails the deploy. Try up to three times, waiting longer before each retry.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before the last deploy attempt
        if: steps.retry1.outcome == 'failure'
        run: sleep 90
      - id: retry2
        if: steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
